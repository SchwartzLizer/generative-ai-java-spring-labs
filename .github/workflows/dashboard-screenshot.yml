name: Dashboard screenshots
on:
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: support
          POSTGRES_USER: support
          POSTGRES_PASSWORD: screenshot-db-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package flagship app
        run: ./mvnw --batch-mode --no-transfer-progress -pl customer-support-platform -am package -DskipTests
      - name: Start app with demo provider
        env:
          DB_URL: jdbc:postgresql://localhost:5432/support
          DB_USERNAME: support
          DB_PASSWORD: screenshot-db-password
          AI_PROVIDER: demo
          APP_AGENT_PASSWORD: screenshot-agent-password
          APP_ADMIN_PASSWORD: screenshot-admin-password
        run: |
          java -jar customer-support-platform/target/customer-support-platform-1.0.0-SNAPSHOT.jar > app.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://localhost:8080/actuator/health/liveness && break || sleep 2; done
      - name: Seed synthetic feedback
        run: |
          curl --fail --silent --user agent:screenshot-agent-password -H 'Content-Type: application/json' -d '{"customerReference":"CUST-SCREENSHOT","message":"The app crashes during checkout"}' http://localhost:8080/api/v1/feedback > feedback.json
          id=$(python -c "import json; print(json.load(open('feedback.json'))['id'])")
          curl --fail --silent --user agent:screenshot-agent-password -X POST http://localhost:8080/api/v1/feedback/$id/analyses
          curl --fail --silent --user agent:screenshot-agent-password -X POST http://localhost:8080/api/v1/feedback/$id/response-drafts
      - name: Capture dashboard with Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => { const browser = await chromium.launch({headless:true}); const context = await browser.newContext({httpCredentials:{username:'agent',password:'screenshot-agent-password'},viewport:{width:1440,height:1000}}); const page = await context.newPage(); await page.goto('http://localhost:8080/dashboard'); await page.screenshot({path:'dashboard.png',fullPage:true}); await page.goto('http://localhost:8080/feedback/' + (require('./feedback.json').id)); await page.screenshot({path:'feedback-detail.png',fullPage:true}); await browser.close(); })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: |
            dashboard.png
            feedback-detail.png
