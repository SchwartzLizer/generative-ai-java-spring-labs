name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify all modules and PostgreSQL integration tests
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify -DfailIfNoTests=true
      - name: Build flagship image
        run: docker build -f customer-support-platform/Dockerfile -t generative-ai-java-spring-labs:ci .
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
