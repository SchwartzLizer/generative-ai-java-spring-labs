<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feedback detail</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header class="topbar"><div><a class="back" th:href="@{/dashboard}">← Back to dashboard</a><p class="eyebrow">FEEDBACK DETAIL</p><h1 th:text="${feedback.customerReference}">CUST-001</h1><p class="muted" th:text="${feedback.status}">NEW</p></div></header><main class="container detail"><section class="panel"><p class="eyebrow">CUSTOMER MESSAGE</p><p class="message-body" th:text="${feedback.message}">Message</p><div class="actions"><form th:action="@{'/api/v1/feedback/' + ${feedback.id} + '/analyses'}" method="post"><button type="submit">Analyze feedback</button></form><form th:action="@{'/api/v1/feedback/' + ${feedback.id} + '/response-drafts'}" method="post"><button type="submit" class="secondary">Create draft</button></form></div></section><section class="panel"><div class="panel-heading"><h2>Analysis history</h2><span class="pill" th:text="${#lists.size(feedback.analyses)}">0</span></div><div th:if="${#lists.isEmpty(feedback.analyses)}" class="empty">No analysis yet.</div><article class="timeline" th:each="analysis : ${feedback.analyses}"><div><strong th:text="${analysis.sentiment}">NEGATIVE</strong><span class="status" th:text="${analysis.urgency}">HIGH</span><span class="pill" th:text="${analysis.category}">TECHNICAL</span></div><p th:text="${analysis.recommendedAction}">Next action</p></article></section><section class="panel"><div class="panel-heading"><h2>Response drafts</h2><span class="pill" th:text="${#lists.size(feedback.drafts)}">0</span></div><div th:if="${#lists.isEmpty(feedback.drafts)}" class="empty">No response draft yet.</div><article class="draft" th:each="draft : ${feedback.drafts}"><p th:text="${draft.content}">Draft text</p><footer><span class="status" th:text="${draft.decision}">PENDING</span><small th:text="${#temporals.format(draft.createdAt, 'dd MMM yyyy HH:mm')}">28 Aug 2026</small></footer></article></section></main></body></html>
