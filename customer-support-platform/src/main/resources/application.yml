spring:
  application.name: customer-support-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/support}
    username: ${DB_USERNAME:support}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  ai.model.chat: none
  thymeleaf.cache: false
  mvc.problemdetails.enabled: false
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  ai:
    provider: ${AI_PROVIDER:demo}
    model: ${AI_MODEL:demo-rules-v1}
    timeout: ${AI_TIMEOUT:PT10S}
  security:
    agent-username: ${APP_AGENT_USERNAME:agent}
    agent-password: ${APP_AGENT_PASSWORD:}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
