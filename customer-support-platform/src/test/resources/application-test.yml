spring:
  config.activate.on-profile: test
  datasource.url: jdbc:h2:mem:support;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  datasource.driver-class-name: org.h2.Driver
  datasource.username: sa
  datasource.password:
  jpa.hibernate.ddl-auto: create-drop
  flyway.enabled: false
app.security:
  agent-password: ${TEST_AGENT_PASSWORD:test-agent-password}
  admin-password: ${TEST_ADMIN_PASSWORD:test-admin-password}
  agent-username: agent
  admin-username: admin
